# 飞书推送配置示例。复制为 feishu.yaml 后填写，该文件不进 Git、不打包。
# 密钥（App ID/Secret、Webhook URL/Secret）只放 .env，不写在这里。
channel: app              # app = 自建应用机器人（首选）；webhook = 群自定义机器人（备选）
chat_id: ""               # 自建应用发送目标：客户单人专用群
allowed_chat_ids: []      # 只响应这些群的消息，留空表示不启用指令
allowed_user_ids: []      # 只响应这些用户的消息，留空表示不启用指令