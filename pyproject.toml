[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stock-auditor"
version = "0.1.0"
description = "基本面选股辅助与智能审计系统"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "duckdb>=1.0",
    "polars>=1.0",
    "pyarrow>=16.0",
    "akshare>=1.14",
    "pdfplumber>=0.11",
    "openai>=1.30",
    "tenacity>=8.3",
    "apscheduler>=3.10,<4",
    "lark-oapi>=1.3",
    "httpx>=0.27",
    "jinja2>=3.1",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
tushare = ["tushare>=1.4"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "detect-secrets>=1.5",
    "pre-commit>=3.7",
]

[project.scripts]
sa = "stock_auditor.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_auditor"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Typer 的 Option/Argument 需要在参数默认值里调用
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Windows 的系统临时目录可能被其他进程占用权限，测试临时目录统一放项目 var/ 下
addopts = "-ra --basetemp=var/pytest-tmp"